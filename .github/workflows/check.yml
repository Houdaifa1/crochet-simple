name: check and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# runs on main wait their turn instead of being cancelled halfway through a deploy
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  # assets, format, types, unit tests and the plain build, beside the browser tests
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/web/node_modules/.astro
          key: astro-plain-${{ github.run_id }}
          restore-keys: astro-plain-
      - run: pnpm check:assets
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # every browser test, split over machines that run at the same time
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, shard: 1/2 }
          - { project: chromium, browser: chromium, shard: 2/2 }
          - { project: webkit, browser: webkit, shard: 1/2 }
          - { project: webkit, browser: webkit, shard: 2/2 }
          - { project: firefox, browser: firefox, shard: 1/2 }
          - { project: firefox, browser: firefox, shard: 2/2 }
          - { project: admin, browser: chromium, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.version.outputs.playwright }}-${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - uses: actions/cache@v6
        with:
          path: apps/web/node_modules/.astro
          key: astro-test-${{ hashFiles('tests/fixtures/content/**', 'apps/web/src/**', 'packages/artwork/**') }}
          restore-keys: astro-test-
      - uses: actions/cache@v6
        with:
          path: apps/cms/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build:test
      - run: pnpm build:admin
      # timing tests need a quiet machine, so they run on the Mac only
      - run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # meanwhile the real site is built from the last published content, ready to go online
  site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      site_url: ${{ steps.content.outputs.site_url }}
      published_at: ${{ steps.content.outputs.published_at }}
      domains: ${{ steps.content.outputs.domains }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # photos already resized on an earlier run are reused; only new ones are made
      - uses: actions/cache@v6
        with:
          path: apps/web/node_modules/.astro
          key: astro-site-${{ github.run_id }}
          restore-keys: astro-site-
      - id: content
        run: pnpm --filter @crochet-simple/cms pull-content
      - run: pnpm build
        env:
          SITE_URL: ${{ steps.content.outputs.site_url }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/dist/
          retention-days: 1
          compression-level: 0

  # online only when every check passed; then the live pages are opened, and a failure is undone
  release:
    needs: [static, browsers, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: apps/web/dist/
      # a publish from the Mac during this run already put newer content online; never overwrite it
      - id: fresh
        run: pnpm --filter @crochet-simple/cms content-current
        env:
          BUILT_FROM: ${{ needs.site.outputs.published_at }}
      # every address of the site, so none is detached by the deploy
      - if: steps.fresh.outputs.current == 'true'
        id: deploy
        run: pnpm --filter @crochet-simple/web exec wrangler deploy $DOMAINS
        env:
          DOMAINS: ${{ needs.site.outputs.domains }}
      - if: steps.deploy.outcome == 'success'
        id: live
        run: |
          site="${SITE_URL%/}"
          get() { curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w "%{http_code} $1\n" "$site$1"; }
          get /
          get /patterns/
          get /journal/
          get /sitemap-index.xml
          pattern=$(curl -fsS "$site/patterns/" | grep -o 'href="/patterns/[a-z0-9-]*/"' | grep -v '/category/' | head -1 | cut -d'"' -f2)
          get "$pattern"
          pdf=$(curl -fsS "$site$pattern" | grep -o 'href="/downloads/[^"]*\.pdf"' | head -1 | cut -d'"' -f2)
          if [ -n "$pdf" ]; then get "$pdf"; fi
        env:
          SITE_URL: ${{ needs.site.outputs.site_url }}
      - if: failure() && steps.deploy.outcome == 'success'
        run: pnpm --filter @crochet-simple/web exec wrangler rollback --message "live pages failed after release" --yes
